<style>
:root {
  --royal-gold: #D4AF37;
  --royal-gold-light: #F4E5B8;
  --royal-gold-dark: #B8941F;  --dark-blue: #0A1A3F;
  --dark-blue-light: #1A2B5C;
  --dark-blue-lighter: #2A3B6C;
  --white: #FFFFFF;
  --off-white: #FAFAFA;
  --cream: #FDF8EE;
  --text-dark: #1a1a1a;
  --text-muted: #6b7280;
  --shadow-sm: 0 2px 8px rgba(10, 26, 63, 0.08);
  --shadow-md: 0 8px 24px rgba(10, 26, 63, 0.12);
  --shadow-lg: 0 20px 60px rgba(10, 26, 63, 0.15);
  --shadow-gold: 0 10px 40px rgba(212, 175, 55, 0.3);
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: all 0.25s ease;
  --bg-primary: #FFFFFF;
  --bg-secondary: #FAFAFA;
  --bg-tertiary: #F5F5F5;
  --text-primary: #0A1A3F;
  --text-secondary: #4a5568;
  --border-color: rgba(10, 26, 63, 0.1);
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.3);
}

[data-theme="dark"] {
  --bg-primary: #0A1A3F;
  --bg-secondary: #0F2350;
  --bg-tertiary: #142A5C;
  --text-primary: #FFFFFF;
  --text-secondary: #B8C1D9;
  --border-color: rgba(212, 175, 55, 0.2);
  --glass-bg: rgba(10, 26, 63, 0.6);
  --glass-border: rgba(212, 175, 55, 0.3);
  --text-dark: #FFFFFF;
  --text-muted: #B8C1D9;
  --cream: #0F2350;
  --off-white: #0F2350;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 80px;
}
body {
  font-family: 'Poppins', sans-serif;
  color: var(--text-primary);
  background: var(--bg-primary);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background 0.4s ease, color 0.4s ease;
}

h1, h2, h3, h4, h5 {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  line-height: 1.2;
  color: var(--text-primary);
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
}

.section {
  padding: 100px 0;
  position: relative;
}

.section-header {
  text-align: center;
  margin-bottom: 70px;
}

.section-tag {
  display: inline-block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  color: var(--royal-gold);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 16px;
  font-weight: 600;
  position: relative;
  padding: 0 20px;
}

.section-tag::before,
.section-tag::after {
  content: '';
  position: absolute;
  top: 50%;  width: 30px;
  height: 1px;
  background: var(--royal-gold);
}

.section-tag::before { left: -20px; }
.section-tag::after { right: -20px; }

.section-title {
  font-size: clamp(2rem, 4vw, 3.2rem);
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--dark-blue) 0%, var(--royal-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

[data-theme="dark"] .section-title {
  background: linear-gradient(135deg, var(--royal-gold-light) 0%, var(--royal-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.section-subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  max-width: 650px;
  margin: 0 auto;
}

/* ============ NAVIGATION ============ */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 20px 0;
  transition: var(--transition);
  background: transparent;
}

.navbar.scrolled {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  padding: 12px 0;
  box-shadow: var(--shadow-md);}

.nav-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--white);
  transition: var(--transition);
}

.navbar.scrolled .logo { color: var(--text-primary); }

.logo-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-dark) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 1.5rem;
  box-shadow: var(--shadow-gold);
  position: relative;
  overflow: hidden;
}

.logo-icon::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
  animation: shine 3s infinite;
}

@keyframes shine {
  0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }  100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

.logo-text {
  display: flex;
  flex-direction: column;
}

.logo-text-main {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.logo-text-sub {
  font-size: 0.7rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--royal-gold);
  font-weight: 500;
}

.nav-menu {
  display: flex;
  list-style: none;
  gap: 36px;
  align-items: center;
}

.nav-menu a {
  text-decoration: none;
  color: var(--white);
  font-size: 0.95rem;
  font-weight: 500;
  position: relative;
  transition: var(--transition);
  padding: 8px 0;
}

.navbar.scrolled .nav-menu a { color: var(--text-primary); }

.nav-menu a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--royal-gold);  transition: var(--transition);
}

.nav-menu a:hover::after,
.nav-menu a.active::after { width: 100%; }

.nav-menu a:hover { color: var(--royal-gold); }

.nav-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

.theme-toggle {
  background: transparent;
  border: 1.5px solid var(--royal-gold);
  color: var(--royal-gold);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  font-size: 1rem;
}

.theme-toggle:hover {
  background: var(--royal-gold);
  color: var(--white);
  transform: rotate(180deg);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: var(--transition);
  font-family: 'Poppins', sans-serif;
  position: relative;
  overflow: hidden;}

.btn-primary {
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-dark) 100%);
  color: var(--white);
  box-shadow: var(--shadow-gold);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 45px rgba(212, 175, 55, 0.5);
}

.btn-outline {
  background: transparent;
  color: var(--white);
  border: 2px solid var(--white);
}

.btn-outline:hover {
  background: var(--white);
  color: var(--dark-blue);
  transform: translateY(-3px);
}

.mobile-toggle {
  display: none;
  background: transparent;
  border: none;
  color: var(--white);
  font-size: 1.5rem;
  cursor: pointer;
}

.navbar.scrolled .mobile-toggle { color: var(--text-primary); }

/* ============ HERO SECTION ============ */
.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--white);
}

.hero-bg {
  position: absolute;
  inset: 0;  background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
  background-size: cover;
  background-position: center;
  z-index: -2;
  animation: slowZoom 20s ease-in-out infinite alternate;
}

@keyframes slowZoom {
  0% { transform: scale(1); }
  100% { transform: scale(1.1); }
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(10, 26, 63, 0.85) 0%, rgba(10, 26, 63, 0.6) 50%, rgba(212, 175, 55, 0.3) 100%);
  z-index: -1;
}

.hero-content {
  text-align: center;
  max-width: 900px;
  padding: 0 24px;
  z-index: 1;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  background: rgba(212, 175, 55, 0.15);
  border: 1px solid var(--royal-gold);
  border-radius: 50px;
  font-size: 0.85rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 30px;
  backdrop-filter: blur(10px);
  animation: fadeInDown 1s ease;
}

.hero-badge i { color: var(--royal-gold); }

.hero-title {
  font-size: clamp(2.5rem, 6vw, 5rem);
  color: var(--white);
  margin-bottom: 24px;
  line-height: 1.1;
  animation: fadeInUp 1s ease 0.2s both;}

.hero-title .gold {
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-style: italic;
}

.hero-subtitle {
  font-size: clamp(1rem, 2vw, 1.25rem);
  margin-bottom: 40px;
  opacity: 0.95;
  letter-spacing: 1px;
  animation: fadeInUp 1s ease 0.4s both;
  font-weight: 300;
}

.hero-services {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-bottom: 50px;
  animation: fadeInUp 1s ease 0.6s both;
}

.hero-service-tag {
  padding: 8px 20px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50px;
  font-size: 0.9rem;
  transition: var(--transition);
}

.hero-service-tag:hover {
  background: var(--royal-gold);
  border-color: var(--royal-gold);
  transform: translateY(-3px);
}

.hero-cta {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeInUp 1s ease 0.8s both;}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 60px;
  margin-top: 80px;
  flex-wrap: wrap;
  animation: fadeInUp 1s ease 1s both;
}

.stat-item {
  text-align: center;
}

.stat-number {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--royal-gold);
  display: block;
}

.stat-label {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: 0.8;
}

.scroll-indicator {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--white);
  font-size: 0.8rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  animation: bounce 2s infinite;
  cursor: pointer;
}

.scroll-indicator i {
  display: block;
  margin-top: 10px;
  font-size: 1.2rem;
}

@keyframes bounce {  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-10px); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ ABOUT SECTION ============ */
.about {
  background: var(--bg-secondary);
  position: relative;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}

.about-image {
  position: relative;
}

.about-image-main {
  width: 100%;
  height: 500px;
  object-fit: cover;
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
}

.about-image-secondary {
  position: absolute;
  bottom: -40px;
  right: -40px;
  width: 220px;
  height: 280px;
  object-fit: cover;
  border-radius: 20px;
  border: 8px solid var(--bg-secondary);
  box-shadow: var(--shadow-lg);
}
.about-badge {
  position: absolute;
  top: 30px;
  left: -30px;
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-dark) 100%);
  color: var(--white);
  padding: 20px 30px;
  border-radius: 16px;
  text-align: center;
  box-shadow: var(--shadow-gold);
}

.about-badge-number {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1;
}

.about-badge-text {
  font-size: 0.75rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 5px;
}

.about-content h2 {
  font-size: clamp(2rem, 3.5vw, 2.8rem);
  margin-bottom: 24px;
}

.about-content h2 span {
  color: var(--royal-gold);
  font-style: italic;
}

.about-text {
  color: var(--text-secondary);
  margin-bottom: 20px;
  font-size: 1.05rem;
}

.about-features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 30px 0;
}
.about-feature {
  display: flex;
  align-items: center;
  gap: 12px;
}

.about-feature-icon {
  width: 45px;
  height: 45px;
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-dark) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  flex-shrink: 0;
}

.about-feature-text {
  font-weight: 600;
  color: var(--text-primary);
}

/* ============ SERVICES SECTION ============ */
.services {
  background: var(--bg-primary);
  position: relative;
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.service-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 40px 30px;
  text-align: center;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.service-card::before {  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--royal-gold) 0%, var(--royal-gold-light) 100%);
  transform: scaleX(0);
  transition: var(--transition);
}

.service-card:hover {
  transform: translateY(-10px);
  box-shadow: var(--shadow-lg);
  border-color: var(--royal-gold);
}

.service-card:hover::before { transform: scaleX(1); }

.service-icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--dark-blue) 0%, var(--dark-blue-light) 100%);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--royal-gold);
  font-size: 2rem;
  margin: 0 auto 24px;
  transition: var(--transition);
  position: relative;
}

.service-card:hover .service-icon {
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-dark) 100%);
  color: var(--white);
  transform: rotateY(360deg);
}

.service-title {
  font-size: 1.3rem;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.service-desc {
  color: var(--text-secondary);
  font-size: 0.95rem;
  margin-bottom: 20px;}

.service-link {
  color: var(--royal-gold);
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
}

.service-link:hover { gap: 14px; }

/* ============ GALLERY SECTION ============ */
.gallery {
  background: var(--bg-secondary);
}

.gallery-filters {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 50px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 10px 24px;
  background: transparent;
  border: 1.5px solid var(--border-color);
  border-radius: 50px;
  cursor: pointer;
  font-weight: 500;
  color: var(--text-primary);
  transition: var(--transition);
  font-family: 'Poppins', sans-serif;
}

.filter-btn.active,
.filter-btn:hover {
  background: linear-gradient(135deg, var(--royal-gold) 0%, var(--royal-gold-dark) 100%);
  color: var(--white);
  border-color: var(--royal-gold);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 200px;  gap: 16px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  cursor: pointer;
  transition: var(--transition);
}

.gallery-item:nth-child(1) { grid-row: span 2; }
.gallery-item:nth-child(4) { grid-column: span 2; }
.gallery-item:nth-child(7) { grid-row: span 2; }
.gallery-item:nth-child(9) { grid-column: span 2; }

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.gallery-item:hover img { transform: scale(1.1); }

.gallery-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10, 26, 63, 0.9) 0%, transparent 60%);
  display: flex;
  align-items: flex-end;
  padding: 24px;
  opacity: 0;
  transition: var(--transition);
}

.gallery-item:hover .gallery-overlay { opacity: 1; }

.gallery-info {
  color: var(--white);
  transform: translateY(20px);
  transition: var(--transition);
}

.gallery-item:hover .gallery-info { transform: translateY(0); }

.gallery-info h4 {
  color: var(--white);
  font-size: 1.2rem;
  margin-bottom: 4px;}

.gallery-info p {
  color: var(--royal-gold);
  font-size: 0.85rem;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.gallery-zoom {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 45px;
  height: 45px;
  background: var(--royal-gold);
  color: var(--white);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: scale(0);
  transition: var(--transition);
}

.gallery-item:hover .gallery-zoom { transform: scale(1); }

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10, 26, 63, 0.95);
  backdrop-filter: blur(10px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.lightbox.active { display: flex; }

.lightbox-content {
  max-width: 90%;
  max-height: 90vh;
  position: relative;
  animation: zoomIn 0.4s ease;
}

@keyframes zoomIn {  from { opacity: 0; transform: scale(0.8); }
